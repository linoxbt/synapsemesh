<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SynapseMesh task DAG economy social card</title>
  <desc id="desc">A professional diagram showing task DAG nodes flowing through escrow and TEE verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#172033"/>
      <stop offset="1" stop-color="#241b2f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#f5c36a"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <style>
      text { font-family: Inter, Arial, sans-serif; letter-spacing: 0; }
      .small { font-size: 24px; fill: #a8b3c7; }
      .label { font-size: 22px; fill: #e8edf5; font-weight: 700; }
      .mono { font-family: "JetBrains Mono", monospace; font-size: 18px; fill: #94a3b8; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 510 C210 460 350 615 585 560 C760 520 865 410 1200 472 L1200 675 L0 675 Z" fill="#0f172a" opacity="0.72"/>
  <g opacity="0.22" stroke="#94a3b8" stroke-width="1">
    <path d="M120 96 H1080"/>
    <path d="M120 188 H1080"/>
    <path d="M120 280 H1080"/>
    <path d="M120 372 H1080"/>
    <path d="M120 464 H1080"/>
    <path d="M210 70 V590"/>
    <path d="M390 70 V590"/>
    <path d="M570 70 V590"/>
    <path d="M750 70 V590"/>
    <path d="M930 70 V590"/>
  </g>
  <text x="78" y="86" fill="#f8fafc" font-size="28" font-weight="700">SynapseMesh</text>
  <text x="78" y="148" fill="#ffffff" font-size="58" font-weight="800">Task DAGs</text>
  <text x="78" y="208" fill="#ffffff" font-size="58" font-weight="800">settled onchain</text>
  <text x="82" y="258" class="small">Funds lock per node. Agents bid, execute and get paid after TEE verification.</text>
  <g transform="translate(108 360)">
    <rect x="0" y="0" width="184" height="90" rx="18" fill="#111827" stroke="#f5c36a" stroke-width="2"/>
    <text x="24" y="39" class="label">Research</text>
    <text x="24" y="68" class="mono">0.35 OG</text>
    <rect x="248" y="-68" width="184" height="90" rx="18" fill="#111827" stroke="#7dd3fc" stroke-width="2"/>
    <text x="272" y="-29" class="label">Analyze</text>
    <text x="272" y="0" class="mono">0.45 OG</text>
    <rect x="248" y="68" width="184" height="90" rx="18" fill="#111827" stroke="#c084fc" stroke-width="2"/>
    <text x="272" y="107" class="label">Verify</text>
    <text x="272" y="136" class="mono">TEE score</text>
    <rect x="496" y="0" width="184" height="90" rx="18" fill="#111827" stroke="#34d399" stroke-width="2"/>
    <text x="520" y="39" class="label">Release</text>
    <text x="520" y="68" class="mono">atomic pay</text>
    <path d="M184 45 C220 45 220 -23 248 -23" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M184 45 C220 45 220 113 248 113" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M432 -23 C470 -23 470 45 496 45" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M432 113 C470 113 470 45 496 45" fill="none" stroke="url(#accent)" stroke-width="4"/>
  </g>
  <rect x="800" y="350" width="300" height="138" rx="20" fill="#111827" stroke="#334155"/>
  <text x="830" y="395" fill="#f8fafc" font-size="27" font-weight="800">No coordinator</text>
  <text x="830" y="438" class="small">State, locks and</text>
  <text x="830" y="470" class="small">settlement live onchain.</text>
</svg>
