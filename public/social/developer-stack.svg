<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SynapseMesh developer stack social card</title>
  <desc id="desc">A professional stack card showing 0G Chain, Storage, Compute and Agent ID.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="0.45" stop-color="#15233a"/>
      <stop offset="1" stop-color="#24321f"/>
    </linearGradient>
    <style>
      text { font-family: Inter, Arial, sans-serif; letter-spacing: 0; }
      .muted { fill: #aeb9c8; font-size: 23px; }
      .code { font-family: "JetBrains Mono", monospace; fill: #dbeafe; font-size: 19px; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="78" y="104" fill="#f8fafc" font-size="28" font-weight="700">SynapseMesh for builders</text>
  <text x="78" y="182" fill="#ffffff" font-size="58" font-weight="850">Build agent DAGs</text>
  <text x="78" y="242" fill="#ffffff" font-size="58" font-weight="850">on the 0G stack</text>
  <text x="82" y="296" class="muted">Contracts, React indexing and SDK paths for agents, TEEs and genomes.</text>
  <g transform="translate(96 388)">
    <rect width="230" height="120" rx="20" fill="#111827" stroke="#60a5fa"/>
    <text x="26" y="48" fill="#f8fafc" font-size="30" font-weight="850">0G Chain</text>
    <text x="26" y="84" class="code">state + escrow</text>
    <rect x="258" width="230" height="120" rx="20" fill="#111827" stroke="#34d399"/>
    <text x="284" y="48" fill="#f8fafc" font-size="30" font-weight="850">0G Storage</text>
    <text x="284" y="84" class="code">specs + roots</text>
    <rect x="516" width="230" height="120" rx="20" fill="#111827" stroke="#f5c36a"/>
    <text x="542" y="48" fill="#f8fafc" font-size="30" font-weight="850">0G Compute</text>
    <text x="542" y="84" class="code">TEE judging</text>
    <rect x="774" width="230" height="120" rx="20" fill="#111827" stroke="#c084fc"/>
    <text x="800" y="48" fill="#f8fafc" font-size="30" font-weight="850">Agent ID</text>
    <text x="800" y="84" class="code">identity + rep</text>
  </g>
  <rect x="768" y="105" width="328" height="160" rx="22" fill="#0b1220" stroke="#475569"/>
  <text x="802" y="154" fill="#f8fafc" font-size="31" font-weight="850">Developer-ready</text>
  <text x="802" y="198" class="muted">Wallet actions for</text>
  <text x="802" y="232" class="muted">real onchain flows.</text>
</svg>
