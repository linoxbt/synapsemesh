<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SynapseMesh Evolution Lab social card</title>
  <desc id="desc">A professional visualization of ERC-721 genome NFTs, fitness scores and inference revenue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#17111f"/>
      <stop offset="0.48" stop-color="#1d2032"/>
      <stop offset="1" stop-color="#102624"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <style>
      text { font-family: Inter, Arial, sans-serif; letter-spacing: 0; }
      .muted { fill: #a8b3c7; font-size: 23px; }
      .mono { font-family: "JetBrains Mono", monospace; fill: #cbd5e1; font-size: 18px; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="76" y="102" fill="#f8fafc" font-size="28" font-weight="700">SynapseMesh Evolution Lab</text>
  <text x="76" y="176" fill="#ffffff" font-size="58" font-weight="850">Genome NFTs</text>
  <text x="76" y="236" fill="#ffffff" font-size="58" font-weight="850">for AI model adapters</text>
  <text x="80" y="290" class="muted">Lineage, adapter roots, fitness, market state and revenue are onchain.</text>
  <g transform="translate(122 385)" stroke="url(#line)" stroke-width="5" fill="none">
    <path d="M0 72 C80 72 102 0 180 0 C258 0 282 72 360 72 C438 72 462 0 540 0 C618 0 642 72 720 72"/>
    <path d="M0 0 C80 0 102 72 180 72 C258 72 282 0 360 0 C438 0 462 72 540 72 C618 72 642 0 720 0"/>
  </g>
  <g fill="#111827" stroke="#475569" stroke-width="2">
    <rect x="128" y="500" width="182" height="78" rx="16"/>
    <rect x="394" y="500" width="182" height="78" rx="16"/>
    <rect x="660" y="500" width="182" height="78" rx="16"/>
    <rect x="926" y="500" width="182" height="78" rx="16"/>
  </g>
  <text x="154" y="531" class="mono">mint NFT</text>
  <text x="154" y="558" fill="#f8fafc" font-size="25" font-weight="800">Genome</text>
  <text x="420" y="531" class="mono">evaluate</text>
  <text x="420" y="558" fill="#f8fafc" font-size="25" font-weight="800">Fitness</text>
  <text x="686" y="531" class="mono">breed</text>
  <text x="686" y="558" fill="#f8fafc" font-size="25" font-weight="800">GenOps</text>
  <text x="952" y="531" class="mono">earn</text>
  <text x="952" y="558" fill="#f8fafc" font-size="25" font-weight="800">Inference</text>
  <rect x="820" y="110" width="280" height="162" rx="20" fill="#111827" stroke="#34d399"/>
  <text x="850" y="158" fill="#f8fafc" font-size="30" font-weight="850">Why it matters</text>
  <text x="850" y="202" class="muted">Ownership and</text>
  <text x="850" y="236" class="muted">upgrades become assets.</text>
</svg>
